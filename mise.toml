# The Remy-Sport site. The tasks come from emdash-run — EmDash's own commands in the right order:
#
#   mise run site:start   work on the site      mise run site:check   before a commit
#   mise run site:stop                          mise run model:sync   after a model change in the admin
#   mise run live:ship    deploy it             add -- --live to act on the deployed site
#
# All of them: mise tasks ls. What each does: https://github.com/joeblew999/emdash-run

[settings]
experimental = true

[tools]
node = "26"
pnpm = "12"
fnox = "1.36.0"   # keeps the Cloudflare token signin:access needs

[env]
# The deployed site's address. astro.config.mjs uses it as the site's public address in a build;
# content:pull, signin:access and the live: tasks need it.
LIVE_URL = "https://remy-sport-site.gedw99.workers.dev"
# Who may sign in to the deployed site (signin:access, signin:token -- --live).
ADMIN_EMAIL = ""

# Who a plugin made with plugin:new says it is from. The publisher must be a real Atmosphere
# handle or DID before a plugin can be made.
PLUGIN_PUBLISHER = ""
PLUGIN_AUTHOR = "joeblew999"
PLUGIN_SECURITY_EMAIL = ""

[task_config]
# Pinned to a release of emdash-run. To update, change the tag.
includes = ["git::https://github.com/joeblew999/emdash-run.git//tasks.toml?ref=v1.1.0"]
