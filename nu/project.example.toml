# Your project's mise.toml — copy this to mise.toml and edit it. Your project is this file and
# site/ (created by `mise run setup` from the template below, then yours to edit). Tools, tasks and
# daemons are .config/mise/conf.d/harness.toml and nu/, replaced by `mise run upgrade`.
#
#   mise run setup     first time        mise run dev      after any change
#   mise run check     before a commit   mise run doctor   is the running site right?

[env]
TEMPLATE = "starter-cloudflare" # what `setup` creates site/ from, once: a *-cloudflare template, or starter, blog… for plain Node.js
EMDASH_VERSION = "1.1.0"        # the site is pinned to exactly this
DEPLOY_URL = ""                 # your deployment's URL — `deploy` verifies it; empty until you have one

# Who a scaffolded plugin says it is from. The placeholder works locally; publishing needs yours.
PLUGIN_PUBLISHER = "did:plc:REPLACE-WITH-YOUR-PUBLISHER-DID"
PLUGIN_AUTHOR = "your-name"
PLUGIN_SECURITY_URL = "https://example.com/security"

# What `doctor` asserts about live content: this collection has entries, and they carry data.
# Empty skips the check.
VERIFY_COLLECTION = ""
